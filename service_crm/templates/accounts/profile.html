{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;">
            <!-- Заголовок -->
            <div style="background: var(--info); padding: 20px 24px; display: flex; align-items: center; gap: 12px;">
                <div style="width: 44px; height: 44px; background: rgba(255,255,255,0.2); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <h4 style="margin: 0; color: white; font-weight: 600; font-size: 1.1rem;">Профиль пользователя</h4>
            </div>

            <!-- Данные -->
            <div style="padding: 28px 24px;">
                <!-- Аватар и имя -->
                <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 28px;">
                    <div style="width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; font-weight: 600; {% if user.type == 'admin' %}background: #dc2626;{% elif user.type == 'master' %}background: #059669;{% else %}background: #2563eb;{% endif %}">
                        {{ user.fio|slice:":1" }}
                    </div>
                    <div>
                        <h3 style="margin: 0; font-weight: 700; font-size: 1.3rem;">{{ user.fio }}</h3>
                        <span style="display: inline-block; margin-top: 4px; padding: 3px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; {% if user.type == 'admin' %}background: #fef2f2; color: #991b1b;{% elif user.type == 'master' %}background: #ecfdf5; color: #065f46;{% else %}background: #eff6ff; color: #1e40af;{% endif %}">
                            {{ user.get_type_display }}
                        </span>
                    </div>
                </div>

                <!-- Поля -->
                <div style="display: flex; flex-direction: column; gap: 16px;">
                    <div style="display: flex; padding: 14px 0; border-bottom: 1px solid var(--border);">
                        <span style="width: 180px; color: var(--text-muted); font-weight: 500; font-size: 0.9rem; flex-shrink: 0;">ФИО</span>
                        <span style="font-weight: 500;">{{ user.fio }}</span>
                    </div>
                    <div style="display: flex; padding: 14px 0; border-bottom: 1px solid var(--border);">
                        <span style="width: 180px; color: var(--text-muted); font-weight: 500; font-size: 0.9rem; flex-shrink: 0;">Телефон</span>
                        <span style="font-weight: 500;">{{ user.phone }}</span>
                    </div>
                    <div style="display: flex; padding: 14px 0; border-bottom: 1px solid var(--border);">
                        <span style="width: 180px; color: var(--text-muted); font-weight: 500; font-size: 0.9rem; flex-shrink: 0;">Логин</span>
                        <span style="font-weight: 500;">{{ user.login }}</span>
                    </div>
                    <div style="display: flex; padding: 14px 0;">
                        <span style="width: 180px; color: var(--text-muted); font-weight: 500; font-size: 0.9rem; flex-shrink: 0;">Тип пользователя</span>
                        <span style="display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; {% if user.type == 'admin' %}background: #fef2f2; color: #991b1b;{% elif user.type == 'master' %}background: #ecfdf5; color: #065f46;{% else %}background: #eff6ff; color: #1e40af;{% endif %}">
                            {{ user.get_type_display }}
                        </span>
                    </div>
                </div>
            </div>

            <!-- Кнопка -->
            <div style="padding: 16px 24px; background: #f8fafc; border-top: 1px solid var(--border);">
                <a href="{% url 'dashboard' %}" style="display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; background: #f1f5f9; color: var(--text); border-radius: var(--radius-sm); text-decoration: none; font-size: 0.85rem; font-weight: 500;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    На главную
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
