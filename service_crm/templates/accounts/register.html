{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="width: 56px; height: 56px; background: var(--success); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            </div>
            <h2 style="font-weight: 700; font-size: 1.5rem; margin-bottom: 4px;">Регистрация</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Создайте учётную запись клиента</p>
        </div>

        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 24px;">
            <form method="post">
                {% csrf_token %}

                <div style="margin-bottom: 18px;">
                    <label for="fio" style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text); font-size: 0.9rem;">ФИО</label>
                    <input type="text" id="fio" name="fio" required
                           placeholder="Иванов Иван Иванович"
                           style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit; outline: none; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 18px;">
                    <label for="phone" style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text); font-size: 0.9rem;">Телефон</label>
                    <input type="text" id="phone" name="phone" required
                           placeholder="+7 (XXX) XXX-XX-XX"
                           style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit; outline: none; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 18px;">
                    <label for="login" style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text); font-size: 0.9rem;">Логин</label>
                    <div style="position: relative;">
                        <svg style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="login" name="login" required
                               placeholder="Придумайте логин"
                               style="width: 100%; padding: 12px 12px 12px 40px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit; outline: none; box-sizing: border-box;">
                    </div>
                </div>

                <div style="margin-bottom: 24px;">
                    <label for="password" style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text); font-size: 0.9rem;">Пароль</label>
                    <div style="position: relative;">
                        <svg style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="password" name="password" required
                               placeholder="Придумайте пароль"
                               style="width: 100%; padding: 12px 12px 12px 40px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit; outline: none; box-sizing: border-box;">
                    </div>
                </div>

                <button type="submit" style="width: 100%; padding: 12px; background: var(--success); color: white; border: none; border-radius: var(--radius-sm); font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-bottom: 16px;">
                    Зарегистрироваться
                </button>
            </form>

            <div style="text-align: center; padding-top: 16px; border-top: 1px solid var(--border);">
                <span style="color: var(--text-muted); font-size: 0.85rem;">Уже есть аккаунт?</span>
                <a href="{% url 'login' %}" style="margin-left: 6px; color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.85rem;">Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
