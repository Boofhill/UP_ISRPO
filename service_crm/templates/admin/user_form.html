{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;">
            <!-- Заголовок -->
            <div style="padding: 20px 24px; {% if action == 'create' %}background: #ecfdf5; border-bottom: 1px solid #a7f3d0;{% else %}background: #fffbeb; border-bottom: 1px solid #fde68a;{% endif %} display: flex; align-items: center; gap: 12px;">
                <div style="width: 44px; height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; {% if action == 'create' %}background: #d1fae5;{% else %}background: #fef3c7;{% endif %}">
                    {% if action == 'create' %}
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                    {% else %}
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    {% endif %}
                </div>
                <h4 style="margin: 0; font-weight: 600; font-size: 1.1rem; {% if action == 'create' %}color: #065f46;{% else %}color: #92400e;{% endif %}">
                    {% if action == 'create' %}
                        Создание пользователя
                    {% else %}
                        Редактирование: {{ edit_user.fio }}
                    {% endif %}
                </h4>
            </div>

            <!-- Форма -->
            <div style="padding: 28px 24px;">
                <form method="post">
                    {% csrf_token %}

                    <!-- ФИО -->
                    <div style="margin-bottom: 20px;">
                        <label for="fio" style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text); font-size: 0.9rem;">ФИО</label>
                        <input type="text" id="fio" name="fio"
                               value="{% if edit_user %}{{ edit_user.fio }}{% endif %}" required
                               placeholder="Иванов Иван Иванович"
                               style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit; outline: none; box-sizing: border-box;">
                    </div>

                    <!-- Телефон -->
                    <div style="margin-bottom: 20px;">
                        <label for="phone" style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text); font-size: 0.9rem;">Телефон</label>
                        <input type="text" id="phone" name="phone"
                               value="{% if edit_user %}{{ edit_user.phone }}{% endif %}" required
                               placeholder="+79161234567"
                               style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit; outline: none; box-sizing: border-box;">
                    </div>

                    <!-- Логин -->
                    <div style="margin-bottom: 20px;">
                        <label for="login" style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text); font-size: 0.9rem;">Логин</label>
                        <input type="text" id="login" name="login"
                               value="{% if edit_user %}{{ edit_user.login }}{% endif %}"
                               {% if action == 'update' %}readonly{% endif %} required
                               placeholder="user_login"
                               style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit; outline: none; {% if action == 'update' %}background: #f8fafc; color: var(--text-muted);{% endif %} box-sizing: border-box;">
                    </div>

                    <!-- Пароль -->
                    <div style="margin-bottom: 20px;">
                        <label for="password" style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text); font-size: 0.9rem;">
                            Пароль {% if action == 'update' %}<span style="color: var(--text-muted); font-weight: 400; font-size: 0.8rem;">(оставьте пустым, если не хотите менять)</span>{% endif %}
                        </label>
                        <input type="password" id="password" name="password"
                               placeholder="{% if action == 'create' %}Введите пароль{% else %}Новый пароль{% endif %}"
                               style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit; outline: none; box-sizing: border-box;">
                    </div>

                    <!-- Тип -->
                    <div style="margin-bottom: 24px;">
                        <label for="type" style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text); font-size: 0.9rem;">Тип пользователя</label>
                        <select id="type" name="type" required
                                style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit; background: white; outline: none; cursor: pointer; box-sizing: border-box;">
                            <option value="client" {% if edit_user and edit_user.type == 'client' %}selected{% endif %}>Клиент</option>
                            <option value="master" {% if edit_user and edit_user.type == 'master' %}selected{% endif %}>Мастер</option>
                            <option value="admin" {% if edit_user and edit_user.type == 'admin' %}selected{% endif %}>Администратор</option>
                        </select>
                    </div>

                    <!-- Кнопки -->
                    <div style="display: flex; gap: 12px; padding-top: 20px; border-top: 1px solid var(--border);">
                        <button type="submit" style="padding: 12px 28px; background: var(--primary); color: white; border: none; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600; cursor: pointer;">
                            Сохранить
                        </button>
                        <a href="{% url 'user_list' %}" style="padding: 12px 28px; background: #f1f5f9; color: var(--text); border-radius: var(--radius-sm); text-decoration: none; font-size: 0.9rem; font-weight: 500; text-align: center;">
                            Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
