{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header {% if action == 'create' %}bg-success{% else %}bg-warning{% endif %} text-white">
                <h4 class="mb-0">
                    {% if action == 'create' %}
                        ➕ Создание пользователя
                    {% else %}
                        ✏ Редактирование пользователя {{ edit_user.fio }}
                    {% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="fio" class="form-label">ФИО</label>
                        <input type="text" class="form-control" id="fio" name="fio"
                               value="{% if edit_user %}{{ edit_user.fio }}{% endif %}" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Телефон</label>
                        <input type="text" class="form-control" id="phone" name="phone"
                               value="{% if edit_user %}{{ edit_user.phone }}{% endif %}" required>
                    </div>

                    <div class="mb-3">
                        <label for="login" class="form-label">Логин</label>
                        <input type="text" class="form-control" id="login" name="login"
                               value="{% if edit_user %}{{ edit_user.login }}{% endif %}"
                               {% if action == 'update' %}readonly{% endif %} required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Пароль {% if action == 'update' %}(оставьте пустым, если не хотите менять){% endif %}
                        </label>
                        <input type="password" class="form-control" id="password" name="password">
                    </div>

                    <div class="mb-3">
                        <label for="type" class="form-label">Тип пользователя</label>
                        <select class="form-control" id="type" name="type" required>
                            <option value="client" {% if edit_user and edit_user.type == 'client' %}selected{% endif %}>Клиент</option>
                            <option value="master" {% if edit_user and edit_user.type == 'master' %}selected{% endif %}>Мастер</option>
                            <option value="admin" {% if edit_user and edit_user.type == 'admin' %}selected{% endif %}>Администратор</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="{% url 'user_list' %}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
